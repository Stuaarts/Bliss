name: PostgreSQL recovery drill
on:
  push:
    branches: ['**']
    paths:
      - 'services/api/src/main/resources/db/**'
      - 'infrastructure/scripts/test-database-recovery.py'
      - 'infrastructure/scripts/fixtures/database-recovery.sql'
      - '.github/workflows/database-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: database-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Dump and restore owned disposable PostgreSQL databases
        run: python3 -B infrastructure/scripts/test-database-recovery.py --isolated-docker
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: database-recovery-proof
          path: .work/database-recovery
          retention-days: 7
          if-no-files-found: ignore
