quarkus.application.name=bliss-api
quarkus.http.host=127.0.0.1
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgres:17.6-alpine
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.hibernate-orm.sql-load-script=no-file
quarkus.smallrye-openapi.info-title=Bliss Marketplace API
quarkus.smallrye-openapi.info-version=0.1.0
quarkus.smallrye-openapi.info-description=Local marketplace with OIDC, provider offerings, requests, quotes, durable booking actions and simulated payments. All payment operations are local simulations.
quarkus.swagger-ui.always-include=true
quarkus.log.console.json.enabled=true
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=http://localhost:3000
%dev.quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
%dev.quarkus.http.cors.headers=Content-Type,Authorization,Idempotency-Key

# The packaged application requires explicit database configuration.
%prod.quarkus.datasource.jdbc.url=${BLISS_DB_URL}
%prod.quarkus.datasource.username=${BLISS_DB_USER}
%prod.quarkus.datasource.password=${BLISS_DB_PASSWORD}

# Optional local-demo profile uses Compose and intentionally isolated sample data.
%local.quarkus.http.port=${BLISS_API_PORT:8088}
%local.quarkus.datasource.jdbc.url=${BLISS_DB_URL:jdbc:postgresql://localhost:5433/bliss}
%local.quarkus.datasource.username=${BLISS_DB_USER:bliss}
%local.quarkus.datasource.password=${BLISS_DB_PASSWORD}
%local.quarkus.flyway.locations=db/migration,db/demo
%local.quarkus.log.console.json.enabled=false
%local.quarkus.http.cors.enabled=true
%local.quarkus.http.cors.origins=http://localhost:3000
%local.quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
%local.quarkus.http.cors.headers=Content-Type,Authorization,Idempotency-Key
%test.quarkus.flyway.locations=db/migration,db/demo

# Single trusted issuer. Never accept tokens for a different audience or opaque tokens.
quarkus.oidc.application-type=service
quarkus.oidc.client-id=bliss-api
quarkus.oidc.token.audience=bliss-api
quarkus.oidc.token.subject-required=true
# OIDC verification warnings can include rejected token material; keep it out of logs.
quarkus.log.category."io.quarkus.oidc.runtime.OidcProvider".level=ERROR
quarkus.oidc.roles.role-claim-path=realm_access/roles
quarkus.oidc.token.allow-jwt-introspection=false
quarkus.oidc.token.allow-opaque-token-introspection=false
quarkus.oidc.auth-server-url=${BLISS_OIDC_URL}
%local.quarkus.oidc.auth-server-url=${BLISS_OIDC_URL:http://localhost:8180/realms/bliss}
%dev.quarkus.oidc.auth-server-url=${BLISS_OIDC_URL:http://localhost:8180/realms/bliss}
quarkus.keycloak.devservices.enabled=false
quarkus.jackson.fail-on-unknown-properties=true

# Single local API worker; engine checkpoints restore automatically on startup.
bliss.workflow.dispatch-enabled=true
%test.bliss.workflow.dispatch-enabled=false
bliss.booking.provider-decision-seconds=86400
quarkus.flow.persistence.auto-restore=true
